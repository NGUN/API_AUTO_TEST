[pytest]
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -s -v
markers =
    smoke: 冒烟用例，核心主流程
    negative: 反向用例，异常场景
    write: 会新增、修改、删除数据的用例
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S