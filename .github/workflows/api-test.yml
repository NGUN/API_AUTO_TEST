name: API Auto Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run mode"
        required: true
        default: "collect"
        type: choice
        options:
          - collect
          - test

permissions:
  contents: read

jobs:
  collect-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect pytest cases
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode == 'collect'
        run: pytest --collect-only -q > collect-result.txt

      - name: Run pytest cases
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'test'
        run: pytest -q > pytest-result.txt

      - name: Upload collect result
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode == 'collect'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-collect-result
          path: collect-result.txt

      - name: Upload pytest result
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-result
          path: pytest-result.txt