name: API Auto Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run mode"
        required: true
        default: "collect"
        type: choice
        options:
          - collect
          - test

permissions:
  contents: read

jobs:
  collect-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect pytest cases
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode == 'collect'
        run: pytest --collect-only -q > collect-result.txt

      - name: Check API service
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'test'
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'http://127.0.0.1:11011' }}
        run: |
          python - <<'PY'
          import os
          import socket
          from urllib.parse import urlparse

          base_url = os.getenv("API_BASE_URL")
          parsed = urlparse(base_url)

          host = parsed.hostname
          port = parsed.port or (443 if parsed.scheme == "https" else 80)

          print(f"Checking API service: {host}:{port}")

          try:
              with socket.create_connection((host, port), timeout=5):
                  print("API service is reachable")
          except OSError as e:
              raise SystemExit(
                  f"API service is not reachable: {base_url}\n"
                  f"Reason: {e}\n"
                  "Please start the API service or configure secrets.API_BASE_URL."
              )
          PY

      - name: Run pytest cases
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'test'
        env:
          ENV: test
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'http://127.0.0.1:11011' }}
          API_USERNAME: ${{ secrets.API_USERNAME || 'admin' }}
          API_PASSWORD: ${{ secrets.API_PASSWORD || 'admin123' }}
          DB_HOST: ${{ secrets.DB_HOST || '127.0.0.1' }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_USER: ${{ secrets.DB_USER || 'root' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || '123456' }}
          DB_NAME: ${{ secrets.DB_NAME || 'demo_project' }}
        run: |
          mkdir -p reports
          pytest -q --html=reports/report.html --self-contained-html --alluredir=reports/allure-results --clean-alluredir
          
      - name: Install Allure commandline
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_mode == 'test' }}
        run: npm install -g allure-commandline

      - name: Generate Allure html report
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_mode == 'test' }}
        run: allure generate reports/allure-results -o reports/allure-report --clean
          
      - name: Upload allure results
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_mode == 'test' }}
        uses: actions/upload-artifact@v6
        with:
          name: allure-results
          path: reports/allure-results
          if-no-files-found: warn

      - name: Upload Allure html report
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_mode == 'test' }}
        uses: actions/upload-artifact@v6
        with:
          name: allure-html-report
          path: reports/allure-report
          if-no-files-found: warn

      - name: Upload collect result
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode == 'collect'
        uses: actions/upload-artifact@v6
        with:
          name: pytest-collect-result
          path: collect-result.txt

      - name: Upload pytest html report
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_mode == 'test' }}
        uses: actions/upload-artifact@v6
        with:
          name: pytest-html-report
          path: reports/report.html
          if-no-files-found: warn